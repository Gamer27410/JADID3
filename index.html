<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>O'rta Osiyo Jadidlari</title>
  <script>
    if (!window.Telegram) {
      window.Telegram = { WebApp: { ready:function(){}, expand:function(){}, themeParams:{} } };
    }
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
    }
    .header {
      background: rgba(255,255,255,0.07);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #f4d03f;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .header h1 { font-size: 1.3rem; color: #f4d03f; text-shadow: 0 0 20px rgba(244,208,63,0.4); }
    .header p  { font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 3px; }

    /* ===================== AVATAR — RASM YOKI HARF ===================== */
    .jadid-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f4d03f, #e67e22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
      color: #1a1a2e;
      flex-shrink: 0;
      overflow: hidden;  /* rasm doirani to'ldirsin */
    }
    .jadid-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* Hero sahifasidagi katta avatar */
    .jadid-hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f4d03f, #e67e22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #1a1a2e;
      margin: 0 auto 12px;
      overflow: hidden;
      border: 3px solid rgba(244, 208, 63, 0.4);
    }
    .jadid-hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    /* ================================================================== */

    /* RO'YXAT */
    #jadidlar-page { padding: 16px; }
    .search-box {
      width: 100%; padding: 11px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07); color: #fff;
      font-size: 0.95rem; margin-bottom: 16px; outline: none;
    }
    .search-box::placeholder { color: rgba(255,255,255,0.35); }
    .jadid-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; gap: 14px;
    }
    .jadid-card:active { background: rgba(244,208,63,0.12); border-color: #f4d03f; }
    .jadid-info h3 { font-size: 0.95rem; color: #fff; margin-bottom: 3px; }
    .jadid-info p  { font-size: 0.75rem; color: rgba(255,255,255,0.45); }
    .arrow { margin-left: auto; color: rgba(255,255,255,0.3); font-size: 1.1rem; }

    /* MENYU */
    #jadid-menu-page { padding: 16px; }
    .jadid-hero {
      background: linear-gradient(135deg, rgba(244,208,63,0.1), rgba(230,126,34,0.1));
      border: 1px solid rgba(244,208,63,0.25);
      border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 20px;
    }
    .jadid-hero h2 { font-size: 1.15rem; color: #f4d03f; margin-bottom: 4px; }
    .jadid-hero p  { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
    .menu-btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s; margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px; color: #fff;
    }
    .menu-btn .icon { font-size: 1.3rem; }
    .menu-btn:active { transform: scale(0.98); }
    .menu-btn.bio   { background: linear-gradient(135deg, #2ecc71, #27ae60); }
    .menu-btn.hayot { background: linear-gradient(135deg, #3498db, #2980b9); }
    .menu-btn.asar  { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
    .menu-btn.pdf    { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .menu-btn.asarpdf{ background: linear-gradient(135deg, #d35400, #a04000); }

    /* PDF VIEWER */
    .pdf-section {
      background: rgba(255,255,255,0.05); border-radius: 14px;
      padding: 14px; margin-bottom: 16px;
    }
    .pdf-section-title {
      font-size: 0.78rem; color: rgba(255,255,255,0.45);
      text-align: center; margin-bottom: 10px;
    }
    .pdf-actions {
      display: flex; gap: 10px; margin-top: 10px;
    }
    .pdf-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: none;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; color: #fff;
    }
    .pdf-btn.view-btn     { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .pdf-btn.download-btn { background: linear-gradient(135deg, #f39c12, #e67e22); }
    .pdf-btn:active { transform: scale(0.97); }
    .no-pdf-msg {
      text-align: center; color: rgba(255,255,255,0.35);
      font-size: 0.82rem; padding: 8px;
    }

    /* PDF inline viewer modal */
    #pdf-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.97); z-index: 999;
      flex-direction: column;
    }
    #pdf-modal.open { display: flex; }
    .pdf-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .pdf-modal-title { font-size: 0.9rem; color: #f4d03f; font-weight: 600; }
    .pdf-close-btn {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
    }

    /* KONTENT */
    #content-page { padding: 16px; }
    .content-title {
      font-size: 1rem; color: #f4d03f; margin-bottom: 14px;
      padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .content-text {
      background: rgba(255,255,255,0.05); border-radius: 14px;
      padding: 16px; font-size: 0.92rem; line-height: 1.85;
      color: rgba(255,255,255,0.88); margin-bottom: 16px; white-space: pre-wrap;
    }
    .audio-section {
      background: rgba(255,255,255,0.05); border-radius: 14px; padding: 14px;
    }
    .audio-label {
      font-size: 0.78rem; color: rgba(255,255,255,0.45);
      text-align: center; margin-bottom: 10px;
    }
    .audio-player { width: 100%; border-radius: 10px; outline: none; }
    .no-audio-msg {
      text-align: center; color: rgba(255,255,255,0.35);
      font-size: 0.82rem; padding: 8px; display: none;
    }

    /* ASARLARI PDF CARDS */
    .asarpdf-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(212,84,0,0.25);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 12px;
    }
    .asarpdf-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #d35400, #a04000);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: bold; color: #fff; flex-shrink: 0;
    }
    .asarpdf-info { flex: 1; min-width: 0; }
    .asarpdf-name {
      font-size: 0.88rem; color: #fff; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .asarpdf-fname {
      font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .asarpdf-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .asarpdf-btn {
      padding: 7px 12px; border-radius: 10px; border: none;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
      transition: all 0.2s; color: #fff;
    }
    .asarpdf-btn.view { background: linear-gradient(135deg, #d35400, #a04000); }
    .asarpdf-btn.dl   { background: linear-gradient(135deg, #f39c12, #e67e22); min-width: 36px; }
    .asarpdf-btn:active { transform: scale(0.95); }
    .asarpdf-btn:disabled { opacity: 0.6; }

    .page { display: none !important; }
    .page.active { display: block !important; }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" id="back-btn" onclick="goBack()">← Orqaga</button>
  <h1>📚 O'rta Osiyo Jadidlari</h1>
  <p id="header-sub">Jadidni tanlang</p>
</div>

<div id="jadidlar-page" class="page active">
  <br>
  <input class="search-box" type="text" placeholder="🔍 Jadidni qidiring..." oninput="filterJadidlar(this.value)" />
  <div id="jadidlar-list"></div>
</div>

<div id="jadid-menu-page" class="page">
  <div class="jadid-hero">
    <div class="jadid-hero-avatar" id="hero-avatar"></div>
    <h2 id="hero-name"></h2>
    <p id="hero-years"></p>
  </div>
  <button class="menu-btn bio"   onclick="showContent('bio')">
    <span class="icon">📖</span> Avtobiografiya
  </button>
  <button class="menu-btn hayot" onclick="showContent('hayot')">
    <span class="icon">🌟</span> Hayoti va ijodi
  </button>
  <button class="menu-btn asar"  onclick="showContent('asar')">
    <span class="icon">📝</span> Asarlari
  </button>
  <button class="menu-btn pdf" id="pdf-menu-btn" onclick="showPdfPage()">
    <span class="icon">📄</span> Qo'shimcha ma'lumot (PDF)
  </button>
  <button class="menu-btn asarpdf" id="asarpdf-menu-btn" onclick="showAsarPdfPage()">
    <span class="icon">📚</span> Asarlari (PDF)
  </button>
</div>

<div id="content-page" class="page">
  <div class="content-title" id="content-title"></div>
  <div class="content-text"  id="content-text"></div>
  <div class="audio-section">
    <div class="audio-label">🔊 Matnni eshitish</div>
    <audio id="audio-player" class="audio-player" controls style="display:none;"></audio>
    <div class="no-audio-msg" id="no-audio-msg">🎵 Bu bo'lim uchun audio mavjud emas</div>
  </div>
</div>

<div id="pdf-page" class="page">
  <div class="jadid-hero" style="margin-bottom:16px;">
    <div class="jadid-hero-avatar" id="pdf-hero-avatar"></div>
    <h2 id="pdf-hero-name" style="color:#f4d03f;font-size:1.05rem;"></h2>
    <p style="font-size:0.8rem;color:rgba(255,255,255,0.5);">Qo'shimcha ma'lumot</p>
  </div>
  <div class="pdf-section">
    <div class="pdf-section-title">📄 PDF Fayl</div>
    <div id="pdf-available">
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);text-align:center;padding:8px 0;margin-bottom:8px;" id="pdf-filename-label"></p>
      <div class="pdf-actions">
        <button class="pdf-btn view-btn" onclick="openPdfViewer()">👁 Ko'rish</button>
        <button class="pdf-btn download-btn" onclick="downloadPdf()">⬇️ Yuklab olish</button>
      </div>
      <div class="pdf-actions" style="margin-top:8px;">
        <button class="pdf-btn" onclick="openPdfDirect()" style="background:linear-gradient(135deg,#1abc9c,#16a085);">
          🌐 Brauzerda ochish
        </button>
      </div>
    </div>
    <div id="pdf-unavailable" class="no-pdf-msg">
      📄 Bu jadid uchun PDF fayl hali yuklanmagan
    </div>
  </div>
</div>

<!-- ASARLARI PDF PAGE -->
<div id="asar-pdf-page" class="page">
  <div class="jadid-hero" style="margin-bottom:16px;">
    <div class="jadid-hero-avatar" id="asarpdf-hero-avatar"></div>
    <h2 id="asarpdf-hero-name" style="color:#f4d03f;font-size:1.05rem;"></h2>
    <p style="font-size:0.8rem;color:rgba(255,255,255,0.5);">📚 Asarlari (PDF)</p>
  </div>
  <div id="asarpdf-list-container"></div>
  <div id="asarpdf-empty" class="no-pdf-msg" style="display:none;padding:24px 0;">
    📚 Bu jadid uchun asar PDFlari hali yuklanmagan
  </div>
</div>

<!-- PDF Modal Viewer -->
<div id="pdf-modal">
  <div class="pdf-modal-header">
    <span class="pdf-modal-title" id="pdf-modal-title">📄 PDF Ko'rish</span>
    <button class="pdf-close-btn" onclick="closePdfViewer()">✕ Yopish</button>
  </div>
  <div id="pdf-modal-body" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <iframe id="pdf-frame" src="" style="flex:1;width:100%;border:none;background:#fff;display:none;"></iframe>
    <iframe id="pdf-gdocs" src="" style="flex:1;width:100%;border:none;background:#fff;display:none;" allow="fullscreen"></iframe>
    <div id="pdf-loading" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;">
      <div style="font-size:2.5rem;">📄</div>
      <div style="font-size:1rem;color:#f4d03f;">Yuklanmoqda...</div>
    </div>
  </div>
</div>

<script>
// ================================================================
// ⚠️ FAQAT SHU QATORNI O'ZGARTIRING — O'z GitHub Pages linki
// ================================================================
const BASE_URL = "https://gamer27410.github.io/JADID3";

// ================================================================
// AVATAR HELPER — rasm bor bo'lsa rasm, yo'q bo'lsa harf
// ================================================================
function avatarHTML(jadid, size) {
  // size: "small" (48px card) yoki "large" (80px hero)
  if (jadid.photo) {
    // Rasmli avatar
    return `<img src="${jadid.photo}" alt="${jadid.name}" 
               onerror="this.style.display='none';this.parentElement.textContent='${jadid.initials}'">`;
  }
  // Rasmsiz — faqat harf
  return jadid.initials;
}

// ================================================================
// JADIDLAR — photo maydoni qo'shildi
// Rasm fayllarini GitHub-ga yuklang va yo'lni BASE_URL + "/behbudiy.jpg" ko'rinishida yozing
// Rasmingiz bo'lmasa photo: null qoldiring — harf ko'rinadi
// ================================================================
const jadidlar = [

  // 1. BEHBUDIY
  {
    id: "behbudi", name: "Mahmudxo'ja Behbudiy", years: "1875 – 1919", initials: "B",
    // ↓ Rasmni shu yo'lga yuklang: GitHub repo → images/behbudiy.jpg
    photo: BASE_URL + "/behbudiy.jpg",
    bio: `1. Tug'ilishi va Kelib Chiqishi
Mahmudxo'ja Behbudiy 1875-yil 19-yanvarda Samarqand yaqinidagi Baxshitepa qishlog'ida, ruhoniy oilasida dunyoga kelgan. Uning otasi Ismoilxo'ja islom huquqi bo'yicha yirik mutaxassis bo'lib, o'g'lining bilimli bo'lishiga katta e'tibor bergan. Behbudiy yoshligidanoq o'tkir zehnli bo'lib, o'z davrining diniy va dunyoviy ilmlarini puxta egallagan.

2. Sayohatlar va Dunyoqarashning Shakllanishi
Behbudiyning dunyoqarashi uning sayohatlari davomida tubdan o'zgardi. U haj safari va boshqa maqsadlar bilan quyidagi shaharlarda bo'ldi:

Makka va Madina

Misr (Qohira)

Turkiya (Istanbul)

Rossiya (Peterburg, Moskva, Qozon)

Ushbu sayohatlar davomida u musulmon dunyosining qoloqligini va Yevropa taraqqiyotini solishtirib, yagona najot ma'rifat va ta'limda ekanligini tushunib yetdi.

3. "Padarkush" — Millat Uyg'onishi Uchun Bong
1911-yilda Behbudiy o'zining mashhur "Padarkush" dramasini yozdi. Bu asar o'zbek dramaturgiyasining birinchi namunasi hisoblanadi.

Asosiy g'oyasi: O'qimagan farzandning o'z otasining qotiliga aylanishi orqali ilmsizlikning dahshatli oqibatlarini ko'rsatib berish.

Ta'siri: Ushbu drama butun Turkistonda katta shov-shuvga sabab bo'ldi va odamlarni farzandlarini maktabga berishga chorladi.

4. Matbuot va Nashriyot Faoliyati
Behbudiy o'zining "Behbudiya" nashriyotiga asos soldi. U orqali millatni uyg'otuvchi gazeta va jurnallarni chop etdi:

"Samarqand" gazetasi (1913-yil)

"Oyna" jurnali (1913–1915-yillar) — Bu jurnal jadidchilikning eng nufuzli nashrlaridan biri bo'lib, unda ilm, til, tarix va madaniyat masalalari ko'tarilgan.

5. Ta'lim Islohotchisi
Behbudiy "Usuli jadid" (yangi usul) maktablari uchun bir qator darsliklar yaratdi:

"Muntahabi jug'rofiyai umumiy" (Geografiya)

"Kitobat ul-atfol" (Xat savodi)

"Amaliyoti islom"

Uning eng mashhur shiori :

"Dunyo imoratlari ichida eng ulug'i maktabdir."

6. Fojiali Yakun
1919-yilda Behbudiy safarga chiqqanida Qarshi shahrida Buxoro amirligi amaldorlari tomonidan qo'lga olinadi va qiynoqlar bilan qatl etiladi. Uning vafoti butun turk dunyosi uchun katta yo'qotish bo'ldi. Sadriddin Ayniy uning vafotiga bag'ishlab marsiyalar yozgan.`,
    hayot: `Mahmudxo'ja Behbudiy (1875–1919) — turkiston jadidchilik harakatining asoschisi, buyuk ma'rifatparvar, dramaturg, publitsist va jamoat arbobi.

Hayot yo'li
Tug'ilishi: 1875-yil 19-yanvarda Samarqand shahrida muftiylar oilasida dunyoga kelgan.

Ta'limi: Dastlab madrasada tahsil olgan, so'ngra o'z ustida ishlab, arab, fors va rus tillarini mukammal egallagan. Islom huquqi bo'yicha "muftiy" darajasiga ko'tarilgan.

Sayohatlari: 1900-yillardan boshlab Misr, Turkiya, Rossiya va Arabiston bo'ylab sayohat qilgan. Bu safarlar uning dunyoqarashini o'zgartirib, Turkistonda ta'lim islohotini o'tkazish g'oyasini shakllantirgan.

Siyosiy faoliyati: 1917-yilgi inqilobiy jarayonlarda faol qatnashgan. "Sho'roi islomiya" tashkilotiga rahbarlik qilgan va Turkiston muxtoriyati g'oyasini qo'llab-quvvatlagan.

Vafoti: 1919-yil bahorida safar chog'ida Qarshi shahrida Buxoro amirligi amaldorlari tomonidan qo'lga olingan va qatl etilgan.

Ijodiy va ma'rifiy faoliyati
Teatr: 1911-yilda o'zbek dramaturgiyasining birinchi namunasi bo'lgan "Padarkush" dramasini yozgan. Asar savodsizlikning fojiali oqibatlari haqida bo'lib, 1913-yilda Samarqandda sahnalashtirilgan.

Matbuot: 1913-yilda "Samarqand" gazetasini nashr etgan. 1913–1915-yillarda jadidlarning bosh nashri bo'lgan "Oyna" jurnalini chiqargan.

Darsliklar: Yangi usul maktablari uchun 10 dan ortiq darslik yozgan.

Asosiy g'oyalari
"Haq olinur, berilmas!" — milliy ozodlik va huquqiy mustaqillik shiori.
"Dunyo imoratlari ichida eng ulug'i maktabdir" — jamiyatni faqat bilim orqali o'zgartirish mumkinligi haqidagi qarashi.`,
    asar: `Mahmudxo'ja Behbudiy o'zbek ma'rifatparvarlik harakatining asoschisi va jadidchilikning nazariyotchisi sifatida boy adabiy, publitsistik va ilmiy meros qoldirgan. Uning ijodiy faoliyatidagi eng muhim asari 1911-yilda yozilgan va 1913-yilda sahnalashtirilgan "Padarkush" dramasi bo'lib, bu asar o'zbek dramaturgiyasining tamal toshini qo'ygan hamda o'sha davrdagi jaholat, ilmsizlik va ma'naviy qashshoqlikni keskin tanqid ostiga olgan. Behbudiy faqat badiiy ijod bilan cheklanib qolmay, xalqning savodxonligini oshirish maqsadida darsliklar ham yaratgan; xususan, "Muntaxabi jug'rofiyai umumiy", "Kitobat ul-atfol", "Amoliyoti islom" va "Muxtasari tarixi islom" kabi asarlari maktablarda asosiy qo'llanma bo'lib xizmat qilgan. Adibning publitsistik faoliyati ham g'oyatda sermahsul bo'lib, u "Oyna" jurnali va "Samarqand" gazetasidagi yuzlab maqolalarida til masalasi, millat istiqboli, turkiy xalqlarning birligi hamda dunyoviy ilmlarni egallash zaruratini targ'ib qilgan.`,
    audio: { bio: BASE_URL + "/behbudiy_bio.MP3", hayot: BASE_URL + "/behbudiy_hayot.MP3", asar: BASE_URL + "/behbudiy_asar.MP3" },
    pdf: null,
    asarlarPdf: []
  },

  // 2. FITRAT
  {
    id: "fitrat", name: "Abdurauf Fitrat", years: "1886 – 1938", initials: "F",
    photo: BASE_URL + "/fitrat.jpg",
    bio: `Istanbul shahriga borib, 1909–1913-yillarda dorilfununda tahsil ko'rdi.

Turkiyadagi muhit uning dunyoqarashini tubdan o'zgartirdi. U yerda "Buxoro ta'limi maorif jamiyati"ni tuzib, jadidchilik harakatining faol namoyandalaridan biriga aylandi. Vatanga qaytgach, xalqni jaholatdan qutqarish, ta'limni isloh qilish va milliy mustaqillik g'oyalarini targ'ib qila boshladi.

Fitrat serqirra ijodkor edi. U ham adib, ham olim, ham davlat arbobi sifatida tanildi. Uning "Munozara", "Bayonoti sayyohi hindi" kabi asarlari jamiyatdagi illatlarni fosh etishga qaratilgan edi. Shuningdek, u o'zbek tili grammatikasi, adabiyotshunoslik va musiqashunoslikka doir muhim ilmiy tadqiqotlar yaratdi.`,
    hayot: `Abdurauf Fitrat 1886-yilda Buxoroda tug'ildi. Uning hayoti va ijodi o'zbek ma'rifatparvarlik harakati hamda jadidchilikning eng yorqin sahifalaridan birini tashkil etadi.

Fitrat Istanbul dorilfununida o'qib qaytgach, adabiyot, tilshunoslik, tarix va san'at sohalarida sermahsul ijod qildi. Uning "Munozara" va "Bayonoti sayyohi hindi" asarlari Turkiston xalqi uyg'onishida muhim turtki bo'ldi. Adib "Abulfayzxon" tragediyasi orqali davlatchilik va adolat masalalarini ko'tardi.

U adabiyotshunos olim sifatida "O'zbek adabiyoti namunalari" tazkirasini tuzdi. Tilshunoslik sohasida "Sarf" va "Nahv" darsliklarini yaratib, o'zbek tili grammatikasini tizimga soldi.`,
    asar: `Abdurauf Fitrat ijodi o'zbek adabiyoti va ilm-fani rivojiga ulkan hissa qo'shgan boy merosdan iborat.

Badiiy nasrda "Munozara", "Bayonoti sayyohi hindi" va "Rahbari najot" asarlari mashhur.

Dramaturgiya sohasida "Abulfayzxon" tragediyasi, shuningdek "Chin sevish", "Hind ixtilolchilari" pyesalari.

Ilmiy merosi — tilshunoslikda "Sarf" va "Nahv" darsliklari, adabiyotshunoslikda "Aruz haqida", "Eski o'zbek adabiyoti namunalari" kabi asarlar.`,

    bio: `Abdulhamid Sulaymon o'g'li Cho'lpon 1897-yilda Andijon shahrida tug'ildi. Dastlabki ta'limni eski maktabda, so'ngra madrasada oldi. Rus-tuzem maktabida tahsil ko'rib, rus tili va adabiyoti bilan yaqindan tanishdi.

    asar: `Abdulhamid Cho'lponning asarlari o'zbek adabiyotining barcha janrlarida yangi davrni boshlab bergan boy va serqirra merosdir.

Faoliyati asosan ijtimoiy tarmoqlar va raqamli platformalar orqali yoshlarning savodxonligini oshirishga yo'naltirilgan.`,
    hayot: `Feruzbek Qo'qandiyning hayoti zamonaviy o'zbek filologiyasi, milliy ma'rifatparvarlik va raqamli texnologiyalar uyg'unligidan iborat.

Qo'qon shahrining adabiy muhitida voyaga yetgan Feruzbek yoshligidanoq kitobxonlik va so'z san'atiga mehr qo'ygan.

Magistratura bosqichida Alisher Navoiy nomidagi universitetda taniqli adabiyotshunos olimlar bilan muloqotda bo'lib, bilimlarini mustahkamlagan.

Bugungi kunda o'zbek tili nufuzini oshirish va mumtoz asarlarni yoshlarga yetkazish ustida ishlaydi.`,
    asar: `Feruzbek Qo'qandiyning asarlari ilmiy-metodik, ommabop-tahliliy va raqamli kontent ko'rinishida namoyon bo'ladi.

Metodik qo'llanmalar: "O'zbek tili imlo qoidalari" to'plami, abituriyentlar uchun test bazalari.

Adabiy-tahliliy maqolalar: Navoiyshunoslik, jadidlar merosi tahlili, "Qirq hadis va qirq hikmat" sharhlari.

Raqamli asarlar: "Adabiyot darslari" turkumi, imlo va Nutq madaniyati bo'yicha videobloglar.`,
    audio: { bio: null, hayot: null, asar: null },
    pdf: null,
    asarlarPdf: []
  },
];

// ================================================================
// HOLAT
// ================================================================
let selectedJadid = null;
let currentType   = null;
let navHistory    = ['jadidlar-page'];

// ================================================================
// AVATAR RENDER — ichki yordamchi funksiya
// ================================================================
function setAvatarContent(el, jadid) {
  if (jadid.photo) {
    const img = document.createElement('img');
    img.src   = jadid.photo;
    img.alt   = jadid.name;
    img.onerror = function() {
      // Rasm yuklanmasa harfga qaytadi
      el.innerHTML = '';
      el.textContent = jadid.initials;
    };
    el.innerHTML = '';
    el.appendChild(img);
  } else {
    el.textContent = jadid.initials;
  }
}

// ================================================================
// SAHIFALAR
// ================================================================
function showPage(pageId) {
  ['jadidlar-page','jadid-menu-page','content-page','pdf-page','asar-pdf-page'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('active');
    el.style.display = 'none';
  });
  const target = document.getElementById(pageId);
  target.classList.add('active');
  target.style.display = 'block';
  window.scrollTo(0, 0);

  const backBtn   = document.getElementById('back-btn');
  const headerSub = document.getElementById('header-sub');
  if (pageId === 'jadidlar-page') {
    backBtn.style.display = 'none';
    headerSub.textContent = 'Jadidni tanlang';
  } else {
    backBtn.style.display = 'flex';
    headerSub.textContent = selectedJadid ? selectedJadid.name : '';
  }
}

function goBack() {
  stopAudio();
  navHistory.pop();
  showPage(navHistory[navHistory.length - 1]);
}

// ================================================================
// RO'YXAT
// ================================================================
function renderJadidlar(list) {
  const container = document.getElementById('jadidlar-list');
  container.innerHTML = '';
  list.forEach(jadid => {
    const card = document.createElement('div');
    card.className = 'jadid-card';

    // Avatar
    const avatarEl = document.createElement('div');
    avatarEl.className = 'jadid-avatar';
    setAvatarContent(avatarEl, jadid);

    // Info
    const infoEl = document.createElement('div');
    infoEl.className = 'jadid-info';
    infoEl.innerHTML = `<h3>${jadid.name}</h3><p>${jadid.years}</p>`;

    // Arrow
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '›';

    card.appendChild(avatarEl);
    card.appendChild(infoEl);
    card.appendChild(arrow);
    card.onclick = () => selectJadid(jadid);
    container.appendChild(card);
  });
}

function filterJadidlar(q) {
  renderJadidlar(jadidlar.filter(j => j.name.toLowerCase().includes(q.toLowerCase())));
}

// ================================================================
// JADID TANLASH
// ================================================================
function selectJadid(jadid) {
  selectedJadid = jadid;

  // Hero avatar
  const heroEl = document.getElementById('hero-avatar');
  setAvatarContent(heroEl, jadid);

  document.getElementById('hero-name').textContent  = jadid.name;
  document.getElementById('hero-years').textContent = jadid.years;
  navHistory.push('jadid-menu-page');
  showPage('jadid-menu-page');
}

// ================================================================
// KONTENT
// ================================================================
function showContent(type) {
  currentType = type;
  stopAudio();

  const titles = {
    bio:   '📖 ' + selectedJadid.name + ' — Avtobiografiya',
    hayot: '🌟 ' + selectedJadid.name + ' — Hayoti va ijodi',
    asar:  '📝 ' + selectedJadid.name + ' — Asarlari'
  };

  document.getElementById('content-title').textContent = titles[type];
  document.getElementById('content-text').textContent  = selectedJadid[type] || '(matn kiritilmagan)';

  const audioUrl = selectedJadid.audio && selectedJadid.audio[type];
  const player   = document.getElementById('audio-player');
  const noAudio  = document.getElementById('no-audio-msg');

  if (audioUrl) {
    player.src = audioUrl;
    player.load();
    player.style.display = 'block';
    noAudio.style.display = 'none';
  } else {
    player.src = '';
    player.style.display = 'none';
    noAudio.style.display = 'block';
  }

  navHistory.push('content-page');
  showPage('content-page');
}

function stopAudio() {
  const player = document.getElementById('audio-player');
  if (player) { player.pause(); player.currentTime = 0; }
}

// ================================================================
// PDF SAHIFASI
// ================================================================
function showPdfPage() {
  stopAudio();
  const pdfHeroEl = document.getElementById('pdf-hero-avatar');
  setAvatarContent(pdfHeroEl, selectedJadid);
  document.getElementById('pdf-hero-name').textContent = selectedJadid.name;

  const pdfUrl  = selectedJadid.pdf;
  const avail   = document.getElementById('pdf-available');
  const unavail = document.getElementById('pdf-unavailable');

  if (pdfUrl) {
    avail.style.display   = 'block';
    unavail.style.display = 'none';
    const fname = pdfUrl.split('/').pop();
    document.getElementById('pdf-filename-label').textContent = '📎 ' + fname;
    document.getElementById('pdf-modal-title').textContent = '📄 ' + selectedJadid.name;
  } else {
    avail.style.display   = 'none';
    unavail.style.display = 'block';
  }

  navHistory.push('pdf-page');
  showPage('pdf-page');
}

// ================================================================
// ASARLARI PDF SAHIFASI
// ================================================================
function showAsarPdfPage() {
  stopAudio();
  const asarHeroEl = document.getElementById('asarpdf-hero-avatar');
  setAvatarContent(asarHeroEl, selectedJadid);
  document.getElementById('asarpdf-hero-name').textContent = selectedJadid.name;

  const list      = selectedJadid.asarlarPdf || [];
  const container = document.getElementById('asarpdf-list-container');
  const empty     = document.getElementById('asarpdf-empty');

  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    container.innerHTML = list.map((item, i) => `
      <div class="asarpdf-card">
        <div class="asarpdf-num">${i + 1}</div>
        <div class="asarpdf-info">
          <div class="asarpdf-name">${item.name}</div>
          <div class="asarpdf-fname">${item.file.split('/').pop()}</div>
        </div>
        <div class="asarpdf-btns">
          <button class="asarpdf-btn view" onclick="openAsarPdf('${item.file}','${item.name.replace(/'/g,"\\'")}')">👁 Ko'rish</button>
          <button class="asarpdf-btn dl"   onclick="downloadAsarPdf('${item.file}','${item.file.split('/').pop()}',this)">⬇️</button>
        </div>
      </div>
    `).join('');
  }

  navHistory.push('asar-pdf-page');
  showPage('asar-pdf-page');
}

function openAsarPdf(url, title) {
  const modal   = document.getElementById('pdf-modal');
  const frame   = document.getElementById('pdf-frame');
  const gdocs   = document.getElementById('pdf-gdocs');
  const loading = document.getElementById('pdf-loading');
  document.getElementById('pdf-modal-title').textContent = '📚 ' + title;

  frame.style.display   = 'none';
  gdocs.style.display   = 'none';
  loading.style.display = 'flex';
  loading.innerHTML = '<div style="font-size:2.5rem;">📄</div><div style="font-size:1rem;color:#f4d03f;">Yuklanmoqda...</div>';
  modal.classList.add('open');

  if (isMobile()) {
    const gdocsUrl = 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(url);
    gdocs.src = gdocsUrl;
    gdocs.onload = function() {
      loading.style.display = 'none';
      gdocs.style.display   = 'flex';
    };
    setTimeout(function() {
      if (loading.style.display !== 'none') {
        loading.innerHTML = `
          <div style="font-size:1.8rem;">⚠️</div>
          <div style="font-size:0.95rem;color:#f4d03f;text-align:center;padding:0 20px;">
            Ko'rish sekin yuklanyapti.<br>To'g'ridan-to'g'ri ochishni tavsiya qilamiz.
          </div>
          <button onclick="window.open('${url}','_blank');closePdfViewer();" style="
            background:linear-gradient(135deg,#e74c3c,#c0392b);
            border:none;color:#fff;padding:12px 24px;
            border-radius:12px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:4px;">
            🌐 Brauzerda ochish
          </button>`;
      }
    }, 15000);
  } else {
    frame.src = url;
    frame.onload = function() {
      loading.style.display = 'none';
      frame.style.display   = 'flex';
    };
  }
}

async function downloadAsarPdf(url, fname, btn) {
  btn.disabled    = true;
  btn.textContent = '⏳';
  if (isMobile()) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error();
      const blob = await resp.blob();
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      btn.textContent = '✅';
    } catch(e) {
      window.open(url, '_blank');
      btn.textContent = '🌐';
    }
  } else {
    const a    = document.createElement('a');
    a.href     = url;
    a.download = fname;
    a.target   = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    btn.textContent = '✅';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = '⬇️'; }, 3000);
}

function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}

function openPdfViewer() {
  if (!selectedJadid || !selectedJadid.pdf) return;
  const pdfUrl  = selectedJadid.pdf;
  const modal   = document.getElementById('pdf-modal');
  const frame   = document.getElementById('pdf-frame');
  const gdocs   = document.getElementById('pdf-gdocs');
  const loading = document.getElementById('pdf-loading');

  frame.style.display   = 'none';
  gdocs.style.display   = 'none';
  loading.style.display = 'flex';
  modal.classList.add('open');

  if (isMobile()) {
    const gdocsUrl = 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(pdfUrl);
    gdocs.src = gdocsUrl;
    gdocs.onload = function() {
      loading.style.display = 'none';
      gdocs.style.display   = 'flex';
    };
    setTimeout(function() {
      if (loading.style.display !== 'none') {
        loading.innerHTML = `
          <div style="font-size:1.8rem;">⚠️</div>
          <div style="font-size:0.95rem;color:#f4d03f;text-align:center;padding:0 20px;">
            Ko'rish sekin yuklanyapti.<br>To'g'ridan-to'g'ri ochishni tavsiya qilamiz.
          </div>
          <button onclick="openPdfDirect()" style="
            background:linear-gradient(135deg,#e74c3c,#c0392b);
            border:none;color:#fff;padding:12px 24px;
            border-radius:12px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-top:4px;">
            🌐 Brauzerda ochish
          </button>`;
      }
    }, 15000);
  } else {
    frame.src = pdfUrl;
    frame.onload = function() {
      loading.style.display = 'none';
      frame.style.display   = 'flex';
    };
  }
}

function openPdfDirect() {
  if (!selectedJadid || !selectedJadid.pdf) return;
  window.open(selectedJadid.pdf, '_blank');
  closePdfViewer();
}

function closePdfViewer() {
  const modal   = document.getElementById('pdf-modal');
  const frame   = document.getElementById('pdf-frame');
  const gdocs   = document.getElementById('pdf-gdocs');
  const loading = document.getElementById('pdf-loading');
  modal.classList.remove('open');
  frame.src   = '';
  gdocs.src   = '';
  frame.style.display   = 'none';
  gdocs.style.display   = 'none';
  loading.style.display = 'flex';
  loading.innerHTML = `<div style="font-size:2.5rem;">📄</div><div style="font-size:1rem;color:#f4d03f;">Yuklanmoqda...</div>`;
}

async function downloadPdf() {
  if (!selectedJadid || !selectedJadid.pdf) return;
  const pdfUrl  = selectedJadid.pdf;
  const fname   = selectedJadid.id + '_malumot.pdf';
  const dlBtn   = document.querySelector('.pdf-btn.download-btn');

  dlBtn.disabled    = true;
  dlBtn.textContent = '⏳ Yuklanmoqda...';

  if (isMobile()) {
    try {
      const resp = await fetch(pdfUrl);
      if (!resp.ok) throw new Error('Network error');
      const blob = await resp.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      dlBtn.textContent = '✅ Yuklandi!';
    } catch (e) {
      window.open(pdfUrl, '_blank');
      dlBtn.textContent = '⬇️ Yuklab olish';
    }
  } else {
    const a    = document.createElement('a');
    a.href     = pdfUrl;
    a.download = fname;
    a.target   = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    dlBtn.textContent = '✅ Yuklandi!';
  }

  setTimeout(() => {
    dlBtn.disabled    = false;
    dlBtn.textContent = '⬇️ Yuklab olish';
  }, 3000);
}

// ================================================================
// TELEGRAM
// ================================================================
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

document.addEventListener('DOMContentLoaded', function() {
  const fp = document.getElementById('jadidlar-page');
  fp.style.display = 'block';
  fp.classList.add('active');
  renderJadidlar(jadidlar);
});
</script>
</body>
</html>
